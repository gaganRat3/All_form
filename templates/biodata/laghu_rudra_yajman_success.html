<!doctype html>
<html lang="gu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>લઘુરુદ્ર યજમાન ફોર્મ Success</title>
    <style>
      body {
        font-family: "Noto Sans Gujarati", sans-serif;
        background: #f7f1e5;
        margin: 0;
        padding: 40px 16px;
      }
      .box {
        max-width: 600px;
        margin: 0 auto;
        background: white;
        border-radius: 16px;
        border: 1px solid #ead9b5;
        box-shadow: 0 12px 30px rgba(100, 28, 36, 0.12);
        padding: 40px 30px;
        text-align: center;
      }
      .badge {
        width: 80px;
        height: 80px;
        margin: 0 auto 20px;
        border-radius: 50%;
        background: #1f9d5a;
        color: white;
        display: grid;
        place-items: center;
        font-size: 40px;
        font-weight: 700;
      }
      h1 {
        color: #641c24;
        font-size: 28px;
        margin-bottom: 12px;
      }
      p {
        color: #4b5563;
        font-size: 16px;
        line-height: 1.7;
      }
      .btn {
        display: inline-block;
        margin-top: 24px;
        background: linear-gradient(135deg, #641c24, #8f2d35);
        color: white;
        text-decoration: none;
        padding: 12px 22px;
        border-radius: 8px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="badge">✓</div>
      <h1>ફોર્મ સફળતાપૂર્વક Submit થઈ ગયું છે.</h1>
      <p>તમારી લઘુરુદ્ર યજમાન રજીસ્ટ્રેશનની માહિતી Bhudev Matrimonyમાં સફળતાપૂર્વક સંગ્રહવામાં આવી છે.</p>
      <a class="btn" href="{% url 'home_page' %}">હોમ પેજ પર જાઓ</a>
    </div>
  </body>
</html>
